<script>
const D=[
{n:"Bilangan",s:[
["Operasi hitung dasar (PEMDAS)","Urutan pengerjaan: kurung, pangkat, kali/bagi, lalu tambah/kurang.","Kerjakan prioritas tertinggi dulu; operasi setingkat dikerjakan dari kiri ke kanan.","6+2×(5−3)² = 6+2×4 = 14"],
["Pecahan, desimal, dan persentase","Pecahan a/b; persen = per seratus; desimal = pecahan berpenyebut 10, 100, dst.","Tambah/kurang: samakan penyebut. Kali: lurus. Bagi: kalikan kebalikan.","1/2+1/3 = 5/6; 3/4 = 0,75 = 75%"],
["KPK dan FPB","KPK = kelipatan persekutuan terkecil; FPB = faktor persekutuan terbesar.","Faktorisasi prima. KPK: ambil semua faktor dengan pangkat terbesar. FPB: faktor sama dengan pangkat terkecil.","12=2²·3 dan 18=2·3² → KPK=36, FPB=6"],
["Pangkat dan eksponen","aⁿ = a×a×…×a sebanyak n kali.","aᵐ·aⁿ=aᵐ⁺ⁿ; aᵐ/aⁿ=aᵐ⁻ⁿ; (aᵐ)ⁿ=aᵐⁿ; a⁰=1; a⁻ⁿ=1/aⁿ","2³·2⁴ = 2⁷ = 128"],
["Bentuk akar","√a adalah bilangan tak negatif yang kuadratnya a.","√(ab)=√a·√b. Rasionalkan penyebut: a/√b = a√b/b.","√50 = 5√2; 6/√3 = 2√3"],
["Perbandingan dan proporsi","a:b membandingkan dua besaran; proporsi: a/b = c/d.","Senilai: kali silang. Berbalik nilai: hasil kali tetap.","5 buku Rp40.000 → 8 buku = 8×8.000 = Rp64.000"]],
q:[["8 + 2 × (9 − 6)² = ?",["26","98","44","30"],"Kurung dulu: 3; pangkat: 9; kali: 18; tambah 8 = 26."],["KPK dari 12 dan 18 adalah ...",["36","6","72","24"],"12=2²·3, 18=2·3². KPK=2²·3²=36."],["√72 = ...",["6√2","2√6","12√2","36"],"72=36·2, sehingga √72 = 6√2."]]},
{n:"Aljabar",s:[
["Operasi bentuk aljabar","Suku sejenis (variabel dan pangkat sama) dapat dijumlah atau dikurang.","Kelompokkan suku sejenis, operasikan koefisiennya.","3x+2y−x+5y = 2x+7y"],
["Penyederhanaan bentuk aljabar","Bentuk paling sederhana: pembilang dan penyebut tidak punya faktor sama.","Faktorkan pembilang dan penyebut, lalu coret faktor yang sama.","(x²−9)/(x+3) = (x−3)(x+3)/(x+3) = x−3"],
["Pemfaktoran dan distribusi","a(b+c)=ab+ac; a²−b²=(a+b)(a−b); (a±b)²=a²±2ab+b².","x²+bx+c: cari dua bilangan yang jumlahnya b dan hasil kalinya c.","x²+5x+6 = (x+2)(x+3)"],
["Persamaan aljabar","Kalimat terbuka dengan tanda sama dengan.","Lakukan operasi yang sama pada kedua ruas sampai variabel sendiri.","2x+3=11 → 2x=8 → x=4"],
["Pertidaksamaan aljabar","Memuat tanda <, >, ≤, atau ≥.","Seperti persamaan, tetapi kali/bagi bilangan negatif membalik tanda.","−2x>6 → x<−3"],
["SPLDV","Dua persamaan linear dengan dua variabel.","Eliminasi satu variabel (atau substitusi), lalu cari variabel lain.","x+y=5 dan x−y=1 → x=3, y=2"],
["SPLTV","Tiga persamaan linear dengan tiga variabel.","Eliminasi satu variabel dari dua pasang persamaan sehingga jadi SPLDV.","x+y+z=6; x−y=0; y+z=5 → x=1, y=1, z=4"],
["Sistem pertidaksamaan linear","Gabungan pertidaksamaan; solusinya adalah irisan daerahnya.","Gambar garis batas, uji titik (0,0), arsir, ambil daerah yang beririsan.","x+y≤4, x≥0, y≥0 → segitiga (0,0), (4,0), (0,4)"],
["Program linear","Mencari nilai maksimum/minimum fungsi objektif pada daerah layak.","Tentukan titik pojok daerah layak, substitusi ke fungsi objektif, bandingkan.","Maks 3x+2y di daerah di atas: (4,0)→12, (0,4)→8, maksimum 12"]],
q:[["Jika 3x − 5 = 10, maka x = ...",["5","3","15","−5"],"3x=15, jadi x=5."],["Bentuk faktor dari x² − 5x + 6 adalah ...",["(x−2)(x−3)","(x+2)(x+3)","(x−1)(x−6)","(x+1)(x−6)"],"Dua bilangan jumlah −5 dan hasil kali 6: −2 dan −3."],["Jika x+y=7 dan x−y=3, maka x·y = ...",["10","12","14","21"],"Jumlahkan: 2x=10, x=5; y=2; x·y=10."]]},
{n:"Barisan dan Deret",s:[
["Barisan aritmetika","Barisan dengan selisih tetap b.","Un = a + (n−1)b","2, 5, 8, … → U10 = 2+9·3 = 29"],
["Deret aritmetika","Jumlah n suku pertama barisan aritmetika.","Sn = n/2 · (2a + (n−1)b)","2, 5, 8, … → S10 = 5(4+27) = 155"],
["Barisan geometri","Barisan dengan rasio tetap r.","Un = a·rⁿ⁻¹","3, 6, 12, … → U5 = 3·2⁴ = 48"],
["Deret geometri","Jumlah n suku pertama barisan geometri.","Sn = a(rⁿ−1)/(r−1) untuk r≠1","3+6+12+24+48 → S5 = 3·31/1 = 93"],
["Deret geometri tak hingga","Konvergen jika |r|<1.","S∞ = a/(1−r)","8+4+2+… = 8/(1/2) = 16"],
["Aritmetika sosial","Untung = jual − beli; rugi = beli − jual.","Persen untung = untung/beli × 100%","Beli 80.000, jual 100.000 → untung 25%"],
["Bunga tunggal","Bunga dihitung dari modal awal saja.","B = M·i·t; total = M(1+i·t)","1 juta, 12%/tahun, 2 tahun → bunga 240.000"],
["Bunga majemuk","Bunga ikut berbunga di periode berikutnya.","Mₙ = M(1+i)ⁿ","1 juta, 10%/tahun, 2 tahun → 1.210.000"],
["Diskon dan persentase","Diskon = potongan harga.","Bayar = harga × (100% − d)","Rp200.000 diskon 25% → Rp150.000"]],
q:[["Barisan 4, 7, 10, … Suku ke-20 adalah ...",["61","64","58","67"],"U20 = 4 + 19·3 = 61."],["12 + 6 + 3 + … = ...",["24","18","30","∞"],"a=12, r=1/2 → S∞ = 12/(1/2) = 24."],["Rp2.000.000 dibungakan majemuk 10% per tahun selama 2 tahun menjadi ...",["Rp2.420.000","Rp2.400.000","Rp2.200.000","Rp2.440.000"],"2.000.000 × 1,1² = 2.420.000."]]},
{n:"Himpunan dan Fungsi",s:[
["Konsep himpunan","Kumpulan objek yang terdefinisi jelas; n(A) = banyak anggota.","Banyak himpunan bagian = 2ⁿ.","A={1,2,3} punya 2³ = 8 himpunan bagian"],
["Operasi himpunan","∪ gabungan, ∩ irisan, A−B selisih, Aᶜ komplemen.","n(A∪B) = n(A)+n(B)−n(A∩B)","n(A)=10, n(B)=8, n(A∩B)=3 → n(A∪B)=15"],
["Relasi dan fungsi","Fungsi: setiap anggota domain dipasangkan tepat satu anggota kodomain.","Uji garis vertikal pada grafik: tidak boleh memotong lebih dari satu titik.","f(x)=2x+1 → f(3)=7"],
["Persamaan garis lurus","y = mx + c; melalui (x₁,y₁): y−y₁ = m(x−x₁).","m=(y₂−y₁)/(x₂−x₁). Sejajar: m sama. Tegak lurus: m₁·m₂=−1.","Titik (1,2) dan (3,6) → m=2, y=2x"],
["Fungsi linear","f(x)=ax+b, grafiknya garis lurus.","Titik potong sumbu x: x=−b/a; sumbu y: (0,b).","f(x)=3x−6 → memotong sumbu x di 2, sumbu y di −6"],
["Fungsi kuadrat","f(x)=ax²+bx+c, grafiknya parabola.","Puncak: xp=−b/2a, yp=f(xp). Diskriminan D=b²−4ac.","x²−4x+3 → xp=2, yp=−1"],
["Persamaan kuadrat","ax²+bx+c=0.","Faktorkan atau x=(−b±√D)/2a; x₁+x₂=−b/a; x₁x₂=c/a.","x²−5x+6=0 → x=2 atau x=3"],
["Komposisi fungsi","(f∘g)(x) = f(g(x)).","Substitusikan g(x) ke dalam f.","f=2x+1, g=x² → (f∘g)(x)=2x²+1"],
["Fungsi invers","f⁻¹ membalik kerja f.","Tulis y=f(x), nyatakan x dalam y, lalu tukar x dan y.","f(x)=2x+1 → f⁻¹(x)=(x−1)/2"]],
q:[["f(x)=2x+3 dan g(x)=x². Nilai (f∘g)(2) = ...",["11","49","14","7"],"g(2)=4, f(4)=2·4+3=11."],["Titik puncak parabola y = x² − 6x + 5 adalah ...",["(3, −4)","(−3, 4)","(3, 4)","(6, 5)"],"xp=6/2=3; yp=9−18+5=−4."],["Invers dari f(x) = 3x − 6 adalah ...",["(x+6)/3","(x−6)/3","3x+6","x/3 − 6"],"y=3x−6 → x=(y+6)/3."]]},
{n:"Geometri dan Pengukuran",s:[
["Sudut dan hubungan antarsudut","Berpelurus: jumlah 180°. Berpenyiku: jumlah 90°. Bertolak belakang: sama besar.","Jumlah sudut segitiga 180°; segi-n: (n−2)×180°.","Sudut 35° → penyiku 55°, pelurus 145°"],
["Kesebangunan dan kekongruenan","Sebangun: sudut sama, sisi seletak sebanding. Kongruen: bentuk dan ukuran sama.","Tulis perbandingan sisi seletak, lalu kali silang.","Segitiga sisi 3 dan 4 sebangun dengan sisi 6 dan x → x=8"],
["Teorema Pythagoras","Pada segitiga siku-siku: c² = a² + b².","Tentukan sisi miring (di depan sudut siku-siku), lalu hitung sisi yang dicari.","a=6, b=8 → c=10"],
["Trigonometri dasar","sin=depan/miring, cos=samping/miring, tan=depan/samping.","Sudut istimewa: sin30°=1/2, sin45°=½√2, sin60°=½√3; cos kebalikannya.","Sisi miring 10, sudut 30° → sisi depan = 10·sin30° = 5"],
["Bangun datar","Persegi, persegi panjang, segitiga, jajargenjang, trapesium, layang-layang, belah ketupat, lingkaran.","Kenali sifat sisi, sudut, dan diagonalnya.","Persegi: 4 sisi sama, diagonal sama panjang dan saling tegak lurus"],
["Luas dan keliling bangun datar","Persegi panjang L=p·l, K=2(p+l); segitiga L=½·a·t; trapesium L=½(a+b)t; lingkaran L=πr², K=2πr.","Pilih rumus sesuai bangun, pastikan satuan sama.","Lingkaran r=7 → L=154, K=44"],
["Bangun ruang","Kubus, balok, prisma, limas, tabung, kerucut, bola.","Hitung unsur: sisi, rusuk, titik sudut.","Kubus: 6 sisi, 12 rusuk, 8 titik sudut"],
["Luas permukaan dan volume","Kubus V=s³, LP=6s²; balok V=p·l·t; tabung V=πr²t, LP=2πr(r+t); bola V=4/3·πr³.","Uraikan bangun ruang menjadi bangun datar penyusunnya.","Tabung r=7, t=10 → V=490π ≈ 1.540"],
["Jarak titik, garis, dan bidang","Jarak = panjang ruas garis tegak lurus terpendek.","Buat segitiga siku-siku yang memuat jarak, lalu gunakan Pythagoras.","Kubus rusuk 6: diagonal sisi 6√2, diagonal ruang 6√3"]],
q:[["Sisi siku-siku suatu segitiga 5 cm dan 12 cm. Sisi miringnya ...",["13 cm","17 cm","15 cm","11 cm"],"√(25+144)=√169=13."],["Volume tabung r=7 cm, t=10 cm (π=22/7) adalah ...",["1.540 cm³","770 cm³","154 cm³","3.080 cm³"],"V=22/7·49·10=1.540."],["sin 30° + cos 60° = ...",["1","1/2","√3","0"],"1/2 + 1/2 = 1."]]},
{n:"Statistika dan Peluang",s:[
["Penyajian data","Data disajikan dengan tabel, diagram batang, garis, atau lingkaran.","Diagram lingkaran: sudut = frekuensi/total × 360°.","Frekuensi 20 dari 80 → sudut 90°"],
["Tabel dan diagram","Tabel frekuensi merangkum data; histogram memakai kelas interval.","Hitung total frekuensi, baca tinggi batang sesuai skala.","Frekuensi 3, 5, 2 → total 10"],
["Mean, median, dan modus","Mean = jumlah/banyak data; median = nilai tengah; modus = paling sering muncul.","Urutkan data dulu sebelum mencari median.","2,3,3,5,7 → mean 4, median 3, modus 3"],
["Kuartil dan persentil","Q1, Q2, Q3 membagi data terurut menjadi empat bagian sama banyak.","Q2 = median; Q1 = median separuh bawah; Q3 = median separuh atas.","1,3,5,7,9,11,13 → Q1=3, Q2=7, Q3=11"],
["Jangkauan","Selisih nilai terbesar dan terkecil.","R = max − min; jangkauan antarkuartil H = Q3 − Q1.","2,3,3,5,7 → R = 5"],
["Simpangan dan penyebaran data","Ragam s²=Σ(x−x̄)²/n; simpangan baku s=√s².","Hitung rata-rata, kuadratkan selisih tiap data, rata-ratakan, lalu akarkan.","2,4,6 → x̄=4, s²=8/3"],
["Peluang dasar","P(A) = n(A)/n(S), nilainya 0 sampai 1.","Tentukan ruang sampel S, lalu banyak kejadian A.","Dadu: P(genap) = 3/6 = 1/2"],
["Kaidah pencacahan","Aturan perkalian: m cara dan n cara → m×n cara.","Pecah kejadian menjadi tahap-tahap, kalikan banyak cara tiap tahap.","3 baju × 2 celana = 6 pasangan"],
["Permutasi","Susunan terurut r unsur dari n unsur.","P(n,r) = n!/(n−r)!","P(5,2) = 5·4 = 20"],
["Kombinasi","Pemilihan r unsur dari n unsur tanpa memperhatikan urutan.","C(n,r) = n!/(r!(n−r)!)","C(5,2) = 10"],
["Peluang kejadian","Gabungan: P(A∪B)=P(A)+P(B)−P(A∩B). Saling bebas: P(A∩B)=P(A)P(B). Komplemen: P(Aᶜ)=1−P(A).","Tentukan apakah kejadian saling lepas atau saling bebas.","2 koin: P(dua gambar) = 1/2·1/2 = 1/4"]],
q:[["Rata-rata data 4, 6, 8, 8, 9 adalah ...",["7","6","7,5","8"],"Jumlah 35, dibagi 5 = 7."],["Nilai P(5,2) = ...",["20","10","60","120"],"5!/3! = 5·4 = 20."],["Dua dadu dilempar. Peluang jumlah mata 7 adalah ...",["1/6","1/12","7/36","1/9"],"Ada 6 pasangan dari 36: 1/6."]]}

const T=[["Seperti aturan antre: urutan pengerjaan harus benar supaya hasilnya sama untuk semua orang.","Pecahan itu potongan pizza; persen itu potongan dari 100 potong.","KPK: kapan dua lampu berkedip bersamaan lagi. FPB: ukuran terbesar yang bisa membagi rata keduanya.","Pangkat = perkalian berulang, cara singkat menulis angka yang dikali dirinya sendiri.","Akar adalah kebalikan kuadrat: persegi berluas 25 punya sisi 5.","Seperti resep: kalau porsi dilipatkan, semua bahan ikut dilipatkan."],["Jangan campur apel dengan jeruk: hanya suku yang sejenis boleh dijumlah.","Seperti menyederhanakan 6/9 jadi 2/3: coret yang sama.","Memfaktorkan = membongkar hasil kali. Distribusi = membagikan kali ke tiap suku.","Persamaan itu timbangan: apa pun yang dilakukan ke satu sisi, lakukan juga ke sisi lainnya.","Sama seperti persamaan, tapi jawabannya satu rentang, bukan satu angka.","Dua teka-teki sekaligus, misalnya mencari harga permen dan coklat dari dua struk belanja.","Seperti SPLDV, tapi ada tiga hal yang dicari. Singkirkan satu per satu.","Mewarnai area yang memenuhi semua syarat sekaligus.","Mencari untung terbesar atau biaya terkecil di antara pilihan yang diperbolehkan."],["Pola dengan langkah tetap, seperti tangga yang tiap anak tangganya sama tinggi.","Jumlah semua anak tangga yang sudah dilewati.","Pola kali berulang, seperti sel membelah: 1, 2, 4, 8.","Total dari pola kali berulang itu.","Penjumlahan tanpa akhir yang totalnya tetap berhenti di satu angka, asalkan pengalinya kecil.","Hitungan jual-beli sehari-hari: untung, rugi, dan persennya.","Bunga dihitung dari modal awal, jadi bertambah sama besar tiap tahun.","Bunga berbunga: tiap tahun dihitung dari saldo terbaru, jadi tumbuh makin cepat.","Diskon 25% artinya kamu bayar 75% dari harga."],["Himpunan itu seperti isi tas: jelas apa saja yang ada di dalamnya.","Gabungan = semua anggota kedua kelompok. Irisan = yang masuk di keduanya.","Fungsi seperti mesin: masukkan satu angka, keluar tepat satu hasil.","Garis lurus ditentukan oleh kemiringan (m) dan titik potong sumbu y (c).","Fungsi berbentuk garis lurus, seperti tarif tetap ditambah biaya per kilometer.","Grafiknya melengkung seperti bola yang dilempar; puncaknya titik tertinggi atau terendah.","Mencari kapan hasil fungsi kuadrat tepat nol, yaitu titik potong dengan sumbu x.","Dua mesin disambung: keluaran mesin pertama menjadi masukan mesin kedua.","Invers itu tombol undo: membalikkan kerja fungsi."],["Sudut = besar bukaan. Pelurus 180° (garis lurus), penyiku 90° (pojok siku).","Sebangun = foto yang diperbesar. Kongruen = fotokopi persis.","Khusus segitiga siku-siku: kuadrat sisi miring = jumlah kuadrat dua sisi lainnya.","Cara menghitung tinggi gedung atau panjang tangga dari satu sudut dan satu sisi.","Bangun datar = bentuk dua dimensi seperti gambar di kertas.","Keliling = panjang pagar. Luas = banyaknya ubin penutup.","Bangun ruang = benda tiga dimensi, seperti dadu dan kaleng.","Luas permukaan = kertas pembungkus. Volume = isi yang muat.","Jarak selalu diukur dengan garis terpendek, yaitu yang tegak lurus."],["Mengubah angka mentah menjadi gambar atau tabel supaya mudah dibaca.","Tabel menghitung kemunculan, diagram menggambarkannya.","Mean = diratakan. Median = paling tengah. Modus = paling sering muncul.","Kuartil membagi barisan data menjadi empat bagian sama banyak.","Jangkauan = jarak dari data terkecil ke data terbesar.","Seberapa tersebar data dari rata-ratanya.","Peluang = seberapa mungkin sesuatu terjadi, dari 0 (mustahil) sampai 1 (pasti).","Kalau ada beberapa tahap, kalikan banyak pilihan di tiap tahap.","Permutasi: urutan penting, seperti juara 1, 2, 3.","Kombinasi: urutan tidak penting, seperti memilih anggota tim.","Menggabungkan peluang beberapa kejadian: kata ATAU berarti tambah, kata DAN berarti kali."]];

const P={};const cnt=k=>`${(P[k]||[]).length}/${D[k].s.length}`;
function card(q,cb){const d=document.createElement("div");d.className="card";d.innerHTML=`<p>${q[0]}</p>`;q[1].map((t,i)=>[t,i==0]).sort(()=>Math.random()-.5).forEach(([t,ok])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;if(ok)b.dataset.ok=1;b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;b.classList.add(ok?"ok":"bad");d.querySelector("[data-ok]").classList.add("ok");const p=document.createElement("div");p.className="pb";p.textContent=(ok?"Benar! ":"Kurang tepat. ")+q[2];d.appendChild(p);if(cb)cb(ok)};d.appendChild(b)});return d}
function mini(){const k=ci;document.querySelectorAll(".mq").forEach(e=>{const i=+e.dataset.i;e.appendChild(card(Q[k][i],ok=>{if(ok){P[k]=P[k]||[];if(!P[k].includes(i))P[k].push(i);$("p"+k).textContent=cnt(k)}}))})}
function sim(){const all=[...Q.flat(),...D.flatMap(c=>c.q)].sort(()=>Math.random()-.5).slice(0,10);let sc=0,n=0;document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));$("main").innerHTML=`<h2>🎯 Simulasi TKA</h2><p>10 soal acak dari semua bab.</p><div class="bar"><span id="score">Skor: 0/10</span><button onclick="sim()">Acak ulang</button></div>`;all.forEach((q,i)=>{const c=card(q,ok=>{n++;if(ok)sc++;$("score").textContent=`Skor: ${sc}/10`+(n==10?" – selesai 🎉":"")});c.querySelector("p").innerHTML=`<b>${i+1}.</b> ${q[0]}`;$("main").appendChild(c)});scrollTo(0,0)}
let ci=0;const $=id=>document.getElementById(id);
function go(i){ci=i;$("nav").innerHTML=D.map((c,k)=>`<button class="${k==i?"on":""}" onclick="go(${k})">${k+1}. ${c.n} <small id="p${k}">${cnt(k)}</small></button>`).join("")+`<button onclick="sim()">🎯 Simulasi TKA</button>`;render();scrollTo(0,0)}
function render(){const c=D[ci];
$("main").innerHTML=`<h2>${ci+1}. ${c.n}</h2>`+c.s.map((s,i)=>`<details><summary>${s[0]}</summary><div class="b"><p class="tip">💡 <b>Intinya:</b> ${T[ci][i]}</p><p><b>Definisi:</b> ${s[1]}</p><p><b>Cara penyelesaian:</b> ${s[2]}</p><p class="ex"><b>Contoh:</b> ${s[3]}</p><h4>✏️ Coba sendiri</h4><div class="mq" data-i="${i}"></div></div></details>`).join("")+`<h3>Latihan Campuran Bab</h3><div class="bar"><span id="score"></span><button onclick="quiz()">Acak ulang</button></div><div id="quiz"></div>`;quiz();mini()}
function quiz(){const c=D[ci],box=$("quiz");let sc=0,n=0;box.innerHTML="";$("score").textContent=`Skor: 0/${c.q.length}`;
c.q.forEach((q,qi)=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<p><b>${qi+1}.</b> ${q[0]}</p>`;
q[1].map((t,i)=>[t,i==0]).sort(()=>Math.random()-.5).forEach(([t,ok])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;if(ok)b.dataset.ok=1;
b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;n++;if(ok)sc++;b.classList.add(ok?"ok":"bad");d.querySelector("[data-ok]").classList.add("ok");
const p=document.createElement("div");p.className="pb";p.textContent=(ok?"Benar! ":"Kurang tepat. ")+q[2];d.appendChild(p);
$("score").textContent=`Skor: ${sc}/${c.q.length}`+(n==c.q.length?" – selesai 🎉":"")};d.appendChild(b)});box.appendChild(d)})}
